name: Weekly Sports Card Market Refresh

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh market dataset
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_MARKETPLACE_INSIGHTS_TOKEN: ${{ secrets.EBAY_MARKETPLACE_INSIGHTS_TOKEN }}
          SALES_LIMIT: "100000"
        run: python scripts/refresh_market.py

      - name: Commit refreshed data
        run: |
          git config user.name "Sports Card Market Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/market-sales.csv data/market-summary.json
          git diff --cached --quiet || git commit -m "Refresh market sales data"
          git push
